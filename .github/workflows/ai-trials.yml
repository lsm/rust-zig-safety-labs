name: AI generation comparison (explicit manual run)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Exact OpenAI Responses API model ID"
        required: true
        type: string
      trials:
        description: "Independent generations per task and language arm"
        type: choice
        options: ["1", "3", "5"]
        default: "5"
      max_requests:
        description: "Hard limit on paid model requests, including repairs"
        type: choice
        options: ["30", "90", "180", "300"]
        default: "300"

permissions:
  contents: read

jobs:
  ai-trials:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STUDY_MODEL: ${{ inputs.model }}
      STUDY_TRIALS: ${{ inputs.trials }}
      STUDY_MAX_REQUESTS: ${{ inputs.max_requests }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
      - name: Check versions and harness without model calls
        run: |
          zig version
          rustc --version
          python3 --version
          python3 tools/test_policy.py
          python3 bench/test_reference.py
          python3 bench/test_judge.py
          python3 bench/test_run_ai.py
          python3 bench/run_ai.py --dry-run
      - name: Ensure secret is present before any billable calls
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is required to generate code."
            exit 2
          fi
      - name: Generate and evaluate AI solutions
        run: |
          python3 bench/run_ai.py --model "$STUDY_MODEL" \
            --trials "$STUDY_TRIALS" --max-requests "$STUDY_MAX_REQUESTS"
      - name: Preserve auditable outputs even after errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-generation-trials
          path: |
            bench/results/
            bench/generated/
          if-no-files-found: warn
          retention-days: 30
